<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Prospective v1 finite-policy evaluator architecture</title>
  <desc id="desc">A public agent submits a JSON policy. A weak raw test, an exhaustive finite security oracle, and a benchmark gate report separate results. A second checker validates every candidate and the feasibility proof.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31456a"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17243d; }
      .sub { font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52617b; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17243d; }
      .body { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #34415a; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52617b; }
      .line { stroke: #31456a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #8da1bb; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f7f9fc"/>
  <text x="54" y="60" class="title">Finite-policy evaluation: three separate verdicts</text>
  <text x="54" y="91" class="sub">Prospective v1 method fixture · one authorization family · no agent outcome claimed</text>

  <rect x="54" y="137" width="276" height="385" rx="18" fill="#e9f3ff" stroke="#9cc7ee" stroke-width="2"/>
  <text x="79" y="177" class="label">Agent-visible boundary</text>
  <text x="79" y="215" class="body">Public task and allowed inputs</text>
  <text x="79" y="241" class="body">Starter policy + feedback</text>
  <text x="79" y="267" class="body">Optional retrieved documents</text>
  <rect x="80" y="318" width="224" height="86" rx="12" fill="#fff" stroke="#9cc7ee"/>
  <text x="98" y="352" class="label">Candidate</text>
  <text x="98" y="380" class="body">JSON decision table</text>
  <text x="79" y="458" class="small">No condition label, hidden state,</text>
  <text x="79" y="480" class="small">gate mode, or proof in the prompt</text>

  <rect x="414" y="137" width="470" height="385" rx="18" fill="#fff" stroke="#aab8cd" stroke-width="2"/>
  <text x="439" y="177" class="label">Evaluator-owned channels</text>
  <rect x="443" y="209" width="188" height="105" rx="12" fill="#fff4e3" stroke="#e7bd73"/>
  <text x="461" y="242" class="label">Raw test</text>
  <text x="461" y="272" class="body">Fixed state subset</text>
  <text x="461" y="295" class="small">PASS / FAIL</text>
  <rect x="661" y="209" width="194" height="105" rx="12" fill="#e7f7ee" stroke="#83c7a3"/>
  <text x="679" y="242" class="label">Security oracle</text>
  <text x="679" y="272" class="body">All finite states</text>
  <text x="679" y="295" class="small">SECURE / INSECURE</text>
  <rect x="510" y="379" width="278" height="103" rx="12" fill="#fcecf1" stroke="#d7a0b1"/>
  <text x="529" y="412" class="label">Benchmark gate</text>
  <text x="529" y="440" class="body">Full check + C5 rejection</text>
  <text x="529" y="462" class="small">PASS / FAIL + public feedback</text>

  <path d="M 304 361 H 378 V 260 H 443" class="line"/>
  <path d="M 378 361 V 260 H 661" class="line"/>
  <path d="M 649 314 V 379" class="line"/>
  <text x="352" y="340" class="small">submit</text>

  <rect x="927" y="137" width="219" height="385" rx="18" fill="#f0edff" stroke="#b3a6e4" stroke-width="2"/>
  <text x="950" y="177" class="label">Independent check</text>
  <text x="950" y="220" class="body">Second implementation</text>
  <text x="950" y="249" class="body">Enumerates all policies</text>
  <text x="950" y="278" class="body">Checks task proof</text>
  <rect x="951" y="336" width="171" height="92" rx="12" fill="#fff" stroke="#b3a6e4"/>
  <text x="966" y="366" class="body">A: witness exists</text>
  <text x="966" y="391" class="body">B: contradiction</text>
  <text x="966" y="416" class="body">C: false rejection</text>
  <text x="950" y="479" class="small">Shares declared task facts;</text>
  <text x="950" y="500" class="small">separate checker code</text>
  <path d="M 855 260 H 927" class="soft"/>

  <rect x="54" y="560" width="1092" height="93" rx="14" fill="#fff" stroke="#d6deea"/>
  <text x="78" y="592" class="label">Interpretation boundary</text>
  <text x="78" y="621" class="body">Finite-domain correctness is provable here; security of arbitrary code and cross-domain agent behavior are not.</text>
</svg>
