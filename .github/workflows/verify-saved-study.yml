name: Verify saved study

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify archived exploratory evidence
        run: python -B -m reproduction.verify_project

  portable-offline-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate saved fixtures and excluded pilot audits
        run: sh reproduction/reproduce.sh

  measurement-followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out saved data
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Recompute supplemental analyses
        run: |
          python -B -m analysis.family_discordance_sensitivity --check
          python -B -m analysis.sast_provenance_missingness --check
          python -B -m analysis.full_catalog_calibration_20261030 --verify
          python -B -m analysis.v7_leave_one_world_out_20261104 --check
          python -B -m analysis.historical_feedback_specificity_20261104 --check
          python -B -m analysis.logged_source_surrogate_ast_20261104 --check
          python -B -m analysis.historical_protocol_stop_recount_20261104 --check
          python -B -m analysis.historical_terminate_latency_20261104 --check
          python -B -m analysis.v7_test_set_sufficiency_20261104 --check
          python -B -m analysis.v7_boundary_provider_latency_20261104 --check
      - name: Test supplemental analysis guards
        run: |
          python -B -m unittest -q \
            tests.test_family_discordance_sensitivity \
            tests.test_sast_provenance_missingness \
            tests.test_full_catalog_calibration_20261030 \
            tests.test_v7_leave_one_world_out_20261104 \
            tests.test_historical_feedback_specificity_20261104 \
            tests.test_logged_source_surrogate_ast_20261104 \
            tests.test_historical_protocol_stop_recount_20261104 \
            tests.test_historical_terminate_latency_20261104 \
            tests.test_v7_test_set_sufficiency_20261104 \
            tests.test_v7_boundary_provider_latency_20261104

  matched-pilot-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out saved pilot archives
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Recompute matched-pilot analyses
        run: |
          python -B -m analysis.c5_paired_regression_recount_20261101 --check
          python -B -m analysis.c5_candidate_discordance_20261101 --check
          python -B -m analysis.fresh_matched_verdict_pilot_20261101 --check
          python -B -m analysis.v7_second_wave_20261101 --check
          python -B -m analysis.c5_first_submission_parity_20261104 --check
          python -B -m analysis.v7_crossfamily_20261104 --check
          python -B -m analysis.v7_crossfamily_error_direction_20261104 --check
          python -B -m analysis.v7_temp03_error_direction_20261104 --check
          python -B -m analysis.v7_feedback_replication_20261104 --check
          python -B -m analysis.v7_csrf_transition_direction_20261104 --check
          python -B -m analysis.v7_endpoint_sensitivity_20261104 --check
          python -B -m analysis.v7_gemma_transfer_20261104 --check
          python -B -m analysis.v7_qwen8b_capacity_20261104 --check
      - name: Test archived-pilot validation guards
        run: |
          python -B -m unittest -q \
            tests.test_c5_paired_regression_recount_20261101 \
            tests.test_c5_candidate_discordance_20261101 \
            tests.test_fresh_matched_verdict_pilot_20261101 \
            tests.test_v7_second_wave_20261101 \
            tests.test_c5_first_submission_parity_20261104 \
            tests.test_v7_crossfamily_20261104 \
            tests.test_v7_crossfamily_error_direction_20261104 \
            tests.test_v7_temp03_error_direction_20261104 \
            tests.test_v7_feedback_replication_20261104 \
            tests.test_v7_csrf_transition_direction_20261104 \
            tests.test_v7_gemma_transfer_20261104_excluded \
            tests.test_v7_gemma_transfer_20261104 \
            tests.test_v7_qwen8b_capacity_20261104_excluded \
            tests.test_v7_qwen8b_capacity_20261104 \
            tests.test_v7_crossfamily_20261104_excluded \
            tests.test_v7_feedback_replication_20261104_excluded \
            tests.test_v1_request_archive_relocation

  manuscript-format-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out manuscript and rendered review files
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned rendering libraries
        run: python -m pip install --no-cache-dir -r paper/requirements-render.txt
      - name: Check page limit, formatting, and anonymous metadata
        run: python -B -m unittest -q paper.test_submission_rendering
